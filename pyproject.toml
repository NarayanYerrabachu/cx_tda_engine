[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "cx_tda_engine"
version = "0.1.0"
description = "CortXplorer TDA engine: Mapper, persistent homology, lenses, anomaly and drift findings for tabular data"
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Narayan Yerrabachu" }]
keywords = ["tda", "mapper", "persistent-homology", "anomaly-detection", "topological-data-analysis",
            "unsupervised", "clustering", "text-mining"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.12,<1.15",
  "scikit-learn>=1.4",
  "ripser>=0.6.8",
  "networkx>=3.0",
]

[project.optional-dependencies]
umap = ["umap-learn>=0.5.7"]
viz = ["plotly>=5.0", "matplotlib>=3.8"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10", "build>=1.2", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/NarayanYerrabachu/cx_tda_engine"
Repository = "https://github.com/NarayanYerrabachu/cx_tda_engine"
Changelog = "https://github.com/NarayanYerrabachu/cx_tda_engine/blob/main/CHANGELOG.md"
Issues = "https://github.com/NarayanYerrabachu/cx_tda_engine/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cx_tda_engine"]

[tool.hatch.build.targets.sdist]
include = ["src/cx_tda_engine", "tests", "docs/*.md", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
  # numpy on macOS Accelerate emits spurious matmul FP warnings inside sklearn; not ours
  "ignore:.*encountered in matmul:RuntimeWarning",
  "error::DeprecationWarning:cx_tda_engine",
  "error::FutureWarning:cx_tda_engine",
]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401", "I"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
